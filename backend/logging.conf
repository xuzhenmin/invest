[loggers]
keys=root,app,service,storage,quant,uvicorn

[handlers]
keys=console,file,error_file,rotating_file

[formatters]
keys=detailed,simple,json

[logger_root]
level=INFO
handlers=console,file,error_file

[logger_app]
level=DEBUG
handlers=console,rotating_file,error_file
qualname=app
propagate=0

[logger_service]
level=DEBUG
handlers=rotating_file,error_file
qualname=service
propagate=0

[logger_storage]
level=DEBUG
handlers=rotating_file,error_file
qualname=storage
propagate=0

[logger_quant]
level=DEBUG
handlers=rotating_file,error_file
qualname=quant
propagate=0

[logger_uvicorn]
level=INFO
handlers=console,file
qualname=uvicorn
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=simple
args=(sys.stdout,)

[handler_file]
class=handlers.RotatingFileHandler
level=INFO
formatter=detailed
args=('logs/app.log', 'a', 10485760, 5)

[handler_error_file]
class=handlers.RotatingFileHandler
level=ERROR
formatter=detailed
args=('logs/error.log', 'a', 10485760, 5)

[handler_rotating_file]
class=handlers.TimedRotatingFileHandler
level=DEBUG
formatter=detailed
args=('logs/debug.log', 'midnight', 1, 30)

[formatter_detailed]
format=%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(funcName)s() - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_simple]
format=%(asctime)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_json]
format={"timestamp": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "message": "%(message)s"}
datefmt=%Y-%m-%d %H:%M:%S
